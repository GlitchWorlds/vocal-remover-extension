<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Smart Vocal Remover</h1>
    <p class="sub">Dual-Engine · Real-Time Spectral STFT & Pro DSP</p>
  </header>

  <section class="switch-row">
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
    <span class="switch-label" id="toggleLabel">OFF</span>
  </section>

  <section class="engine-section">
    <div class="meter-head">
      <span>Engine Mode</span>
      <span class="badge" id="engineBadge">Spectral</span>
    </div>
    <div class="engine-selector">
      <button type="button" class="engine-btn active" id="btnSpectral" data-mode="spectral">
        <strong>Spectral Studio</strong>
        <small>Next-Gen STFT Pan Isolator</small>
      </button>
      <button type="button" class="engine-btn" id="btnDsp" data-mode="dsp">
        <strong>Fast Crossover</strong>
        <small>3-Band LR4 + In-Phase</small>
      </button>
    </div>
  </section>

  <section class="meter-section">
    <div class="meter-head">
      <span>Detected vocal pitch</span>
      <span class="pitch-readout" id="pitchReadout">—</span>
    </div>
    <div class="meter">
      <div class="meter-fill" id="pitchBar"></div>
    </div>
    <div class="meter-head small">
      <span>Output level</span>
      <span id="levelReadout">—</span>
    </div>
    <div class="meter">
      <div class="meter-fill level" id="levelBar"></div>
    </div>
  </section>

  <section class="strength-section">
    <div class="meter-head">
      <span>Removal strength</span>
      <span id="strengthValue">100%</span>
    </div>
    <input type="range" id="strength" min="0" max="100" value="100" />
    <p class="hint">0% = Bypass (100% suara asli tanpa beda). 100% = Vokal hilang total, musik & bass tetap utuh.</p>
  </section>

  <footer>
    <span id="statusLine">Klik toggle untuk mulai di tab Spotify aktif.</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
